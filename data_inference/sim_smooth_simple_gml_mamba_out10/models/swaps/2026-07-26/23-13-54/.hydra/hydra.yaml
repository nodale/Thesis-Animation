hydra:
  run:
    dir: /home/me/devel/nn_portable/nn/models/swaps/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/me/devel/nn_portable/nn/models/swaps/${now:%Y-%m-%d}/${now:%H-%M-%S}
    - hydra.mode=RUN
    task:
    - model_run_dir=/home/me/devel/nn_portable/nn/models/latest/simple_gml_mamba_out10/0
    - gen_dir=/home/me/devel/nn_portable/nn/generations
    - infer_zarr=/home/me/devel/nn_portable/nn/infer_log.zarr
    - online_zarr=/home/me/devel/nn_portable/nn/online_data.zarr
    - sim_dataset_path=/home/me/devel/nn_portable/nn/sim_data.zarr
    - training_mode=gml_rollout
  job:
    name: online_learner
    chdir: null
    override_dirname: gen_dir=/home/me/devel/nn_portable/nn/generations,infer_zarr=/home/me/devel/nn_portable/nn/infer_log.zarr,model_run_dir=/home/me/devel/nn_portable/nn/models/latest/simple_gml_mamba_out10/0,online_zarr=/home/me/devel/nn_portable/nn/online_data.zarr,sim_dataset_path=/home/me/devel/nn_portable/nn/sim_data.zarr,training_mode=gml_rollout
    id: ???
    num: ???
    config_name: online_learner
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /home/me/devel/nn_portable/nn
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/me/devel/nn_portable/alphacore-nn/python/tools/nn/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/me/devel/nn_portable/nn/models/swaps/2026-07-26/23-13-54
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
